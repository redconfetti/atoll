name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cc65 python3-pil fonts-urw-base35 console-setup-linux

      - name: Build ROM
        run: ./build.sh "build/atoll-${GITHUB_REF_NAME}.sfc"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/atoll-${GITHUB_REF_NAME}.sfc" \
            --title "Bikini Atoll $GITHUB_REF_NAME" --generate-notes
